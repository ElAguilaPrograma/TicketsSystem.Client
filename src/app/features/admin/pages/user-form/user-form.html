<section class="max-w-3xl mx-auto flex flex-col gap-6">
    <div class="flex items-center gap-4">
        <button [routerLink]="['/user-admin']"
            class="p-2 rounded-full hover:bg-brand-surface text-brand-text-muted hover:text-brand-text transition-colors">
            <ng-icon name="heroArrowLeft" class="text-xl"></ng-icon>
        </button>
        <div>
            <h3 class="text-sm font-medium text-brand-text-muted">User Administration</h3>
            <h1 class="text-4xl font-bold">Add New User</h1>
        </div>
    </div>

    <div class="bg-brand-surface rounded-xl border border-brand-border overflow-hidden">
        <div class="p-6 border-b border-brand-border">
            <h2 class="text-xl font-bold">User Information</h2>
            <p class="text-sm text-brand-text-muted mt-1">Provide the necessary details and assign roles carefully.</p>
        </div>
        <div class="p-6 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">First Name <span
                            class="text-red-500">*</span></label>
                    <input type="text" placeholder="e.g., Jane"
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">Last Name <span
                            class="text-red-500">*</span></label>
                    <input type="text" placeholder="e.g., Doe"
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-brand-text">Email Address <span
                        class="text-red-500">*</span></label>
                <input type="email" placeholder="jane.doe@company.com"
                    class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">Role <span
                            class="text-red-500">*</span></label>
                    <select
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                        <option value="user" selected>User</option>
                        <option value="support_l1">Support L1</option>
                        <option value="support_mgr">Support Manager</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">Account Status</label>
                    <select
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                        <option value="active" selected>Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-brand-text">Notes (Optional)</label>
                <textarea rows="3" placeholder="Department, extra requirements..."
                    class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors"></textarea>
            </div>

        </div>
        <div class="px-6 py-4 bg-brand-bg/30 border-t border-brand-border flex justify-end gap-3">
            <app-button label="Cancel" variant="outline" [routerLink]="['/user-admin']"></app-button>
            <app-button label="Create User" variant="primary"></app-button>
        </div>
    </div>
</section>
