<section class="flex flex-col gap-6 h-full">
    <div class="flex justify-between items-center">
        <div>
            <h3 class="text-sm font-medium text-brand-text-muted">System Overview</h3>
            <h1 class="text-4xl font-bold">Ticket History</h1>
        </div>
        <div>
            <app-button label="Export History" variant="outline"></app-button>
        </div>
    </div>

    <div class="bg-brand-surface rounded-xl border border-brand-border overflow-hidden">
        <!-- Tabs -->
        <div class="flex border-b border-brand-border px-6 pt-4 gap-6">
            <button class="pb-3 text-brand-primary font-bold border-b-2 border-brand-primary">Open Tickets</button>
            <button class="pb-3 text-brand-text-muted font-medium hover:text-brand-text transition-colors">Closed
                Tickets</button>
        </div>

        <div class="p-4 bg-brand-bg/50 flex gap-4 border-b border-brand-border">
            <input type="text" placeholder="Search by title or ID..."
                class="flex-1 px-4 py-2 rounded-lg bg-brand-surface border border-brand-border text-brand-text focus:outline-none focus:border-brand-primary">
            <select
                class="px-4 py-2 rounded-lg bg-brand-surface border border-brand-border text-brand-text focus:outline-none focus:border-brand-primary">
                <option>All Priorities</option>
                <option>Critical</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="border-y border-brand-border bg-brand-bg/20">
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-brand-text-muted uppercase tracking-wider">
                            Ticket ID</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-brand-text-muted uppercase tracking-wider">
                            Title</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-brand-text-muted uppercase tracking-wider">
                            Priority</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-brand-text-muted uppercase tracking-wider">
                            Status</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-brand-text-muted uppercase tracking-wider">
                            Created</th>
                        <th
                            class="px-6 py-3 text-center text-xs font-medium text-brand-text-muted uppercase tracking-wider">
                            Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-brand-border hover:bg-brand-bg/50 cursor-pointer transition-colors"
                        (click)="navigateToTicketHistoy()">
                        <td class="px-6 py-4"><span class="text-cyan-400 font-medium">TCK-1024</span></td>
                        <td class="px-6 py-4"><span class="font-medium">Database migration failed on prod</span></td>
                        <td class="px-6 py-4"><span
                                class="inline-flex items-center px-2.5 py-1 rounded text-xs font-bold uppercase bg-red-500/20 text-red-400 border border-red-500/30">CRITICAL</span>
                        </td>
                        <td class="px-6 py-4"><span class="text-brand-text flex items-center gap-2"><span
                                    class="w-2 h-2 rounded-full bg-amber-400"></span>In Progress</span></td>
                        <td class="px-6 py-4"><span class="text-brand-text-muted">Jan 12, 2026</span></td>
                        <td class="px-6 py-4 flex justify-center"><button
                                class="text-brand-text-muted hover:text-brand-primary"><ng-icon name="heroEye"
                                    class="text-xl"></ng-icon></button></td>
                    </tr>
                    <tr class="border-b border-brand-border hover:bg-brand-bg/50 cursor-pointer transition-colors"
                        (click)="navigateToTicketsDetails()">
                        <td class="px-6 py-4"><span class="text-cyan-400 font-medium">TCK-1023</span></td>
                        <td class="px-6 py-4"><span class="font-medium">Missing translation in French site</span></td>
                        <td class="px-6 py-4"><span
                                class="inline-flex items-center px-2.5 py-1 rounded text-xs font-bold uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30">MEDIUM</span>
                        </td>
                        <td class="px-6 py-4"><span class="text-brand-text flex items-center gap-2"><span
                                    class="w-2 h-2 rounded-full bg-blue-400"></span>Open</span></td>
                        <td class="px-6 py-4"><span class="text-brand-text-muted">Jan 11, 2026</span></td>
                        <td class="px-6 py-4 flex justify-center"><button
                                class="text-brand-text-muted hover:text-brand-primary"><ng-icon name="heroEye"
                                    class="text-xl"></ng-icon></button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="px-6 py-4 flex justify-between items-center text-sm text-brand-text-muted">
            <span>Showing 2 of 24 open tickets</span>
            <div class="flex gap-2">
                <button
                    class="px-3 py-1 border border-brand-border rounded hover:bg-brand-bg disabled:opacity-50">Prev</button>
                <button class="px-3 py-1 border border-brand-border rounded hover:bg-brand-bg">Next</button>
            </div>
        </div>
    </div>
</section>
