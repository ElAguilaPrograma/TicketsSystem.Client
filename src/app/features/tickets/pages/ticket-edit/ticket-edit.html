<section class="max-w-3xl mx-auto flex flex-col gap-6">
    <div class="flex items-center gap-4">
        <button
            class="p-2 rounded-full hover:bg-brand-surface text-brand-text-muted hover:text-brand-text transition-colors">
            <ng-icon name="heroArrowLeft" class="text-xl"></ng-icon>
        </button>
        <div>
            <h3 class="text-sm font-medium text-brand-text-muted">Edit existing ticket</h3>
            <h1 class="text-4xl font-bold">Edit TCK-845</h1>
        </div>
    </div>

    <div class="bg-brand-surface rounded-xl border border-brand-border overflow-hidden">
        <div class="p-6 border-b border-brand-border flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold">Ticket Information</h2>
                <p class="text-sm text-brand-text-muted mt-1">Update the necessary fields to reflect current progress.
                </p>
            </div>
            <!-- Status Badge -->
            <span
                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-2"></span> In Progress
            </span>
        </div>
        <div class="p-6 space-y-6">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-brand-text">Title <span
                        class="text-red-500">*</span></label>
                <input type="text" value="System performance degraded in US-East"
                    class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">Priority</label>
                    <select
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="3">High</option>
                        <option value="4" selected>Critical</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">Assign to</label>
                    <select
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                        <option value="">Unassigned</option>
                        <option value="user_1" selected>John Doe (Support L1)</option>
                        <option value="user_2">Jane Smith (DevOps)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-brand-text">Status</label>
                    <select
                        class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">
                        <option value="1">Open</option>
                        <option value="2" selected>In Progress</option>
                        <option value="3">On Hold</option>
                        <option value="4">Closed</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-brand-text">Description <span
                        class="text-red-500">*</span></label>
                <textarea rows="6"
                    class="w-full px-4 py-2.5 rounded-lg bg-brand-bg border border-brand-border focus:border-brand-primary focus:outline-none transition-colors">We are getting P99 latency above 4 seconds in the US-East region. Started happening directly after the v2.3 deployment.</textarea>
            </div>
        </div>
        <div class="px-6 py-4 bg-brand-bg/30 border-t border-brand-border flex justify-between items-center">
            <button class="text-red-500 hover:text-red-400 font-medium transition-colors">Delete Ticket</button>
            <div class="flex gap-3">
                <app-button label="Discard changes" variant="outline"></app-button>
                <app-button label="Save Changes" variant="primary"></app-button>
            </div>
        </div>
    </div>
</section>
