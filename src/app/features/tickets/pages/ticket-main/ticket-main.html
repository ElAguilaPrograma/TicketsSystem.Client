<section class="flex flex-col gap-6">
    <div class="flex justify-between items-center">
        <div>
            <h3 class="text-sm font-medium text-brand-text-muted">Overview</h3>
            <h1 class="text-4xl font-bold">My Tickets</h1>
        </div>
        <div class="flex gap-3">
            <app-button label="Create Ticket" variant="primary" heroIcon="heroPlus"
                (click)="navigateToCreateTicket()"></app-button>
        </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <app-card label="Total Tickets" [value]="ticketsCount.total"></app-card>
        <app-card label="Open" [value]="ticketsCount.open" valueClass="text-brand-primary"></app-card>
        <app-card label="In Progress" [value]="ticketsCount.inProgress" valueClass="text-amber-500"></app-card>
        <app-card label="Closed" [value]="ticketsCount.closed" valueClass="text-emerald-500"></app-card>
    </div>

    <!-- Recent Tickets -->
    <div class="bg-brand-surface rounded-xl border border-brand-border shadow-sm">
        <div class="p-4 border-b border-brand-border flex gap-4 bg-brand-bg/30">
            <div class="w-8/12">
                <app-searchbar placeholder="Search tickets by ID, subject..." (search)="searchTickets($event)"></app-searchbar>
            </div>  
            <div class="w-4/12 flex gap-4">
                <app-select class="w-full" label="Status" [options]="statusOptions" [showLabel]="false" variant="surface"
                    [(ngModel)]="statusFilter" (ngModelChange)="loadTickets()"></app-select>
            </div>
        </div>

        <div class="overflow-x-auto min-h-[340px]">
            <table class="w-full table-fixed">
                <thead>
                    <tr class="bg-brand-bg/20 border-b border-brand-border">
                        <th class="w-32 px-4 py-3 text-left text-xs font-semibold text-brand-text-muted uppercase tracking-wider">Ticket ID</th>
                        <th class="w-1/3 px-4 py-3 text-left text-xs font-semibold text-brand-text-muted uppercase tracking-wider">Subject</th>
                        <th class="w-32 px-4 py-3 text-left text-xs font-semibold text-brand-text-muted uppercase tracking-wider">Status</th>
                        <th class="w-32 px-4 py-3 text-left text-xs font-semibold text-brand-text-muted uppercase tracking-wider">Priority</th>
                        <th class="w-48 px-4 py-3 text-left text-xs font-semibold text-brand-text-muted uppercase tracking-wider">Created At</th>
                        <th class="w-24 px-4 py-3 text-center text-xs font-semibold text-brand-text-muted uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (ticket of recentTickets; track ticket.id) {
                    <tr class="border-b border-brand-border hover:bg-brand-bg/50 transition-colors">
                        <td class="px-4 py-2.5 font-medium text-sm text-brand-text">#{{ ticket.id }}</td>
                        <td class="px-4 py-2.5">
                            <p class="font-bold text-sm text-brand-text truncate">{{ ticket.subject }}</p>
                        </td>
                        <td class="px-4 py-2.5">
                            <span class="flex w-fit justify-center items-center px-2 py-0.5 rounded text-[11px] font-bold border"
                                  [ngClass]="getStatusClass(ticket.status)">
                                {{ ticket.status }}
                            </span>
                        </td>
                        <td class="px-4 py-2.5">
                             <span class="flex items-center gap-1.5 text-xs text-brand-text-muted">
                                <span [ngClass]="getPriorityClass(ticket.priority)" class="w-2 h-2 rounded-full"></span>
                                {{ ticket.priority }}
                            </span>
                        </td>
                        <td class="px-4 py-2.5 text-xs text-brand-text-muted">{{ ticket.createdAt | date: 'MMM dd, yyyy HH:mm' }}</td>
                        <td class="px-4 py-2.5">
                            <div class="flex justify-center gap-1">
                                <button class="p-1 text-brand-text-muted hover:text-brand-primary transition-colors rounded hover:bg-brand-bg"
                                        (click)="viewTicket(ticket.id)" title="View Details">
                                    <ng-icon name="heroEye"></ng-icon>
                                </button>
                            </div>
                        </td>
                    </tr>
                    }
                    @empty {
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-brand-text-muted text-sm border-b border-brand-border">
                            <div class="flex flex-col items-center justify-center gap-2">
                                <ng-icon name="heroTicket" class="text-4xl text-brand-border"></ng-icon>
                                <p>No tickets found</p>
                            </div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</section>
