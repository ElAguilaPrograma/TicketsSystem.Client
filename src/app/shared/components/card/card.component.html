<div [class]="'bg-brand-surface border border-brand-border rounded-xl shadow-sm overflow-hidden' + class">
    @if (label !== undefined && value !== undefined) {
    <!-- Stat-card mode -->
    <div class="p-4">
        <p class="text-sm text-brand-text-muted font-medium">{{ label }}</p>
        <h2 [class]="'text-2xl font-bold mt-1 ' + valueClass">{{ value }}</h2>
    </div>
    } @else {
    <!-- Full card mode (title / subtitle / ng-content) -->
    @if (title || subtitle) {
    <div class="px-8 pt-8 pb-4">
        @if (title) {
        <h3 class="text-2xl font-bold text-brand-text mb-1">{{ title }}</h3>
        }
        @if (subtitle) {
        <p class="text-brand-text-muted text-sm">{{ subtitle }}</p>
        }
    </div>
    }
    <div class="p-4">
        <ng-content></ng-content>
    </div>
    }
</div>
